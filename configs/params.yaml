solver:
  candidate:
    k: 64
    use_delaunay: true
    use_knn: true
    use_alpha_near: false
    k_base: 30
    edge_cap: 10      
    portals_per_node: 5  
  zones:
    method: "kmeans"
    overlap_pct: 0.10
    target_zone_size: 300
    agents_per_zone: 6
  bees:
    scout_fraction: 0.2
    stagnation_moves: 200
    levy_jump_prob: 0.50
    max_improving_moves: 80
    time_budget_s: 1.5
  local_search:
    use_lk: false
    max_k: 3
    double_bridge: true
    kick_period_moves: 250
    use_or_opt: true
    oropt_gate:         
      forbid_until_pct: 0.5
      intra_zone_until_pct: 0.8
      tau_gain: 3
  delta_phi:
    enabled: true
    lambda_trade: 0.1  # Back to original
    prune_bottom_pct: 30.0  # Prune worst 30% of edges
    min_degree_after_pruning: 8
    max_delta_phi_additions: 0  # Disable for now (all edges positive anyway)
    min_dphi_to_add: 999.0  # Effectively disabled
  integrator:
    method: 'eax_full'
    parents_per_round: 4
    offspring_per_round: 2
    repair_time_ms: 300
    max_ab_cycles: 10  # How many cycle combinations to try
    method: 'popmusic'
    elitist_seed: true
    merge_edge_cap_per_node: 8
    parents_per_round: 4
    rounds: 3
    repair_time_ms: 300
  ehm:
    smoothing_eps: 0.02
    max_edges_per_node: 16
  learning:
    enabled: false
    warmup_tours: 100
    model: 'gbdt'
    feature_set: ['distance','delaunay_adj','degree']
  termination:
    wall_time_s: 1800
    target_gap_pct: 1.0
  multi_hive:
    enabled: false
  hk1tree:
    enabled: false
    epoch_budget_pct: 0.05
    stall_eps_pct: 0.2
  initializers:
    K: 6
    mix: [savings, savings, savings, savings, savings, savings]
    total_budget_pct: 0.25 # 25% of wall time
  traps:
    bee_ball:
      enabled: true
      stall_epochs: 2
      halo_pct: 0.10
      timebox_s: 10

eval:
  workers: 1
  threads: 1

output:
  standard: true