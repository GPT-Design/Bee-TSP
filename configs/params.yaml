solver:
  candidate:
    k: 32
    use_delaunay: true
    use_knn: true
    use_alpha_near: false
    k_base: 30
    edge_cap: 10      
    portals_per_node: 5  
  zones:
    method: "kmeans"
    overlap_pct: 0.10
    target_zone_size: 300
    agents_per_zone: 4
  bees:
    scout_fraction: 0.2
    stagnation_moves: 200
    levy_jump_prob: 0.50
    max_improving_moves: 80
    time_budget_s: 4.0
  local_search:
    use_lk: false
    max_k: 3
    double_bridge: true
    kick_period_moves: 250
    use_or_opt: true
    oropt_gate:         
      forbid_until_pct: 0.5
      intra_zone_until_pct: 0.8
      tau_gain: 3
  features:
    enabled: true
    kd_backend: auto     # or "numpy"
    max_threads: 0       # 0/None = let the lib decide
    time_budget_ms: 400  # small, cheap probe
    log: true            # print a one-line summary
  delta_phi:
    enabled: true
    lambda_trade: 0.1
    prune_bottom_pct: 30.0
    min_degree_after_pruning: 8
    max_delta_phi_additions: 0
    min_dphi_to_add: 999.0
  
  # INTEGRATOR CONFIGURATION
  # Use --integ flag to switch: python run_large3.py --integ eax
  integrator:
  # EAX-specific parameters
    method: 'eax'  # Default method (can be overridden by CLI)    
    eax:
      parents_per_round: 6
      offspring_per_round: 3
      repair_time_ms: 300
      pair_budget_ms: 2500  #150 is default
      max_ab_cycles: 20
      strict_eax_naive_only: false
       
    # POPMUSIC-specific parameters  
    popmusic:
      elitist_seed: true
      merge_edge_cap_per_node: 12
      parents_per_round: 4
      rounds: 1
      repair_time_ms: 200
  ehm:
    smoothing_eps: 0.02
    max_edges_per_node: 16
  learning:
    enabled: false
    warmup_tours: 100
    model: 'gbdt'
    feature_set: ['distance','delaunay_adj','degree']
  termination:
    wall_time_s: 1800
    target_gap_pct: 1.0
  multi_hive:
    enabled: false
  hk1tree:
    enabled: false
    epoch_budget_pct: 0.05
    stall_eps_pct: 0.2
  
  # INITIALIZERS - Size-aware mixing
  initializers:
    K: 6
    # For large instances (n > 1000), Savings works well
    # For small instances (n < 100), NN is better
    mix: [nn, nn, savings, savings, savings, savings]
    total_budget_pct: 0.25
    
    # Size-dependent mixing (optional - requires auto_params integration)
    # small_mix: [nn, nn, nn, nearest_ins, nearest_ins, nearest_ins]  # n < 100
    # mid_mix: [nn, nn, savings, savings, nearest_ins, nearest_ins]   # 100 <= n < 1000  
    # large_mix: [nn, nn, savings, savings, savings, savings]          # n >= 1000
  
  traps:
    bee_ball:
      enabled: true
      stall_epochs: 2
      halo_pct: 0.10
      timebox_s: 10

eval:
  workers: 1
  threads: 1

output:
  standard: true