solver:
  candidate:
    k: 40
    use_delaunay: true
    use_knn: true
    use_alpha_near: false
    # Update_23: Candidate Manager v1.2 optimizations
    k_base: 30          # autoscale by n in code
    edge_cap: 10        # enforce cap ∈ {8,10}
    portals_per_node: 5 # cross-zone connectors P∈{3..7}
  zones:
    method: "kmeans"
    overlap_pct: 0.10
    target_zone_size: 300
    agents_per_zone: 6
  bees:
    scout_fraction: 0.10
    stagnation_moves: 500
    levy_jump_prob: 0.05
    max_improving_moves: 1200
    time_budget_s: 1.0
  local_search:
    use_lk: false
    max_k: 3
    double_bridge: true
    kick_period_moves: 500
    use_or_opt: true
    # W3: Or-opt time gates for SH
    oropt_gate:
      forbid_until_pct: 0.5      # 0-50%: forbid
      intra_zone_until_pct: 0.8  # 50-80%: intra-zone only
      tau_gain: 3                # ≥80%: global pass, require τ ≥ 3-5
  integrator:
    mode: "popmusic"
    merge_edge_cap_per_node: 10
    parents_per_round: 8
    rounds: 2
  ehm:
    smoothing_eps: 0.02
    max_edges_per_node: 16
  learning:
    enabled: false
    warmup_tours: 100
    model: "gbdt"
    feature_set: ["distance","delaunay_adj","degree"]
  termination:
    wall_time_s: 1800
    target_gap_pct: 1.0
  # Update_22: Multi-Hive archived as experimental
  multi_hive:
    enabled: false
  # Update_23: HK 1-tree bound (integer units)
  hk1tree:
    enabled: true
    epoch_budget_pct: 0.05    # ≤5% of wall across run (adaptive)
    stall_eps_pct: 0.2        # stall if Δ dual-gap ≤ 0.1-0.2%

  # W4: Initializer diversity for anytime slope
  initializers:
    K: 4  # build K initial tours, pick best
    mix: ["nn", "nearest_insertion", "farthest_insertion", "random_greedy2opt"]
    total_budget_pct: 0.05    # ≤5% total budget for initialization

  # Bee-Ball traps configuration
  traps:
    bee_ball:
      enabled: true
      stall_epochs: 2         # HK dual-gap stall ≥2 epochs
      halo_pct: 0.10         # keep halo 10-15%
      timebox_s: 10          # tight time-box