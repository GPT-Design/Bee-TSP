# Update_24: Rollback to U22 SH defaults + Metric Lock
# Resolves pr2392@600s 417k→486k performance regression
# Based on Update_24.txt specification

solver:
  candidate:
    k: 40
    use_delaunay: true
    use_knn: true
    use_alpha_near: false
    k_base: 30
    edge_cap: 10                    # U22 default edge cap (rollback from U23)
    portals_per_node: 5             # U22 default portals (rollback from U23)
  zones:
    method: "kmeans"
    overlap_pct: 0.10
    target_zone_size: 300
    agents_per_zone: 6
  bees:
    scout_fraction: 0.10
    stagnation_moves: 500
    levy_jump_prob: 0.05
    max_improving_moves: 1200
    time_budget_s: 1.0
  local_search:
    use_lk: false
    max_k: 3
    double_bridge: true
    kick_period_moves: 500
    use_or_opt: true
    oropt_gate:                     # U22 Or-opt gating
      forbid_until_pct: 0.5
      intra_zone_until_pct: 0.8
      tau_gain: 3
  integrator:
    mode: "popmusic"
    merge_edge_cap_per_node: 10
    parents_per_round: 8
    rounds: 2                       # U22 POPMUSIC: mid & end only
  ehm:
    smoothing_eps: 0.02
    max_edges_per_node: 16
  learning:
    enabled: false
    warmup_tours: 100
    model: "gbdt"
    feature_set: ["distance","delaunay_adj","degree"]
  termination:
    wall_time_s: 1800
    target_gap_pct: 1.0
  multi_hive:
    enabled: false                  # U22: SH only, MH disabled
  hk1tree:
    enabled: false                  # U24: HK 1-tree OFF (rollback from U23)
    epoch_budget_pct: 0.05
    stall_eps_pct: 0.2
  initializers:
    K: 1                           # U24: K=1 (near-zero budget, rollback from U23)
    mix: ["nn"]                    # U24: minimal initialization
    total_budget_pct: 0.05
  traps:
    bee_ball:
      enabled: true
      stall_epochs: 2
      halo_pct: 0.10
      timebox_s: 10

eval:
  workers: 1
  threads: 1

output:
  standard: true